version: '3.8'

services:
  db:
    image: mariadb:11.4
    container_name: esagrada_mariadb_dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass_esagrada_dev
      MYSQL_DATABASE: esagrada_db_dev
      MYSQL_USER: esagrada_dev
      MYSQL_PASSWORD: esagrada_pass_dev
    ports:
      - "3306:3306"
    volumes:
      - mariadb_dev_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: esagrada_phpmyadmin_dev
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_pass_esagrada_dev
      UPLOAD_LIMIT: 64M
    ports:
      - "8080:80"
    depends_on:
      - db

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: esagrada_app_dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      DATABASE_URL: "mysql://esagrada_dev:esagrada_pass_dev@db:3306/esagrada_db_dev"
      NEXTAUTH_SECRET: "esagrada_dev_secret_key_2026"
      NEXTAUTH_URL: "http://localhost:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mariadb_dev_data:
    driver: local
