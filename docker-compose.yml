version: '3.8'

services:
  db:
    image: mariadb:11.4
    container_name: esagrada_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_pass_esagrada_2026
      MYSQL_DATABASE: esagrada_db
      MYSQL_USER: esagrada_user
      MYSQL_PASSWORD: esagrada_pass_2026
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: esagrada_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_pass_esagrada_2026
      UPLOAD_LIMIT: 64M
    ports:
      - "8080:80"
    depends_on:
      - db

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: esagrada_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "mysql://esagrada_user:esagrada_pass_2026@db:3306/esagrada_db"
      NEXTAUTH_SECRET: "esagrada_secret_key_synology_2026_super_secure_jwt"
      NEXTAUTH_URL: "http://localhost:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mariadb_data:
    driver: local
